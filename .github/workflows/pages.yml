# .github\workflows\pages.yml
# Builds the website version (web\, Blazor WebAssembly) from source, runs the web tests,
# and publishes it to GitHub Pages (gettic.github.io/PrintPrice). Separate from build.yml:
# it never touches PrintPrice.exe, the release or signing.

name: Website

on:
  push:
    tags: ['v*']        # every app release
  workflow_dispatch:     # publish by hand (e.g. the first time)

permissions:
  contents: read         # checkout only; the deploy job gets its own Pages rights

concurrency:
  group: pages
  cancel-in-progress: false   # never cut off a deploy halfway

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Web tests
        run: dotnet run --project web/tests -c Release   # exits 1 on a failed test, which stops the deploy

      - name: Publish
        run: |
          dotnet publish web/PrintPriceWeb.csproj -c Release -o out
          touch out/wwwroot/.nojekyll                       # serve _framework as is
          cp out/wwwroot/index.html out/wwwroot/404.html    # page links that GitHub doesn't know still open the app
          ls out/wwwroot/_framework/blazor.webassembly*.js   # fails the job if the Blazor loader is missing

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write       # publish to Pages
      id-token: write    # proves the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
