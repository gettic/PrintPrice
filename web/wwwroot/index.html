<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#202020" />
    <title>Gettic's 3D Print Price Calculator</title>
    <!-- base = the folder this page is in, so it works at / (local test) and at /PrintPrice/ (GitHub Pages) -->
    <base href="/" />
    <script>document.querySelector('base').href = location.pathname.replace(/[^\/]*$/, '');</script>
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>
        // small helpers for the C# side (Store.cs); this site's localStorage only, nothing leaves the browser
        window.printPrice = {
            get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
            remove: function (k) { try { localStorage.removeItem(k); } catch (e) { } },
            lang: function () { return navigator.language || ''; },
            hash: function () { return location.hash || ''; },
            page: function (lang, title) { document.documentElement.lang = lang; if (title) document.title = title; },
            // ---- files (stage 2): the chosen / dropped file stays in the browser; C# reads only the byte ranges it needs ----
            file: null, fileId: 0, dotnet: null,
            hookFiles: function (dotnet, input) {
                var pp = window.printPrice;
                pp.dotnet = dotnet;
                pp.input = input;
                input.addEventListener('change', function () { if (input.files.length) pp.useFile(input.files[0], input.files.length); input.value = ''; });
                var hasFiles = function (e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0; };
                document.addEventListener('dragover', function (e) { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; document.body.classList.add('dragging'); } });
                document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
                document.addEventListener('drop', function (e) {
                    document.body.classList.remove('dragging');
                    if (!hasFiles(e)) return;
                    e.preventDefault();
                    if (e.dataTransfer.files.length) pp.useFile(e.dataTransfer.files[0], e.dataTransfer.files.length);
                });
                pp.ready = true;
            },
            useFile: function (f, count) {
                var pp = window.printPrice;
                pp.file = f; pp.fileId++;
                return pp.dotnet.invokeMethodAsync('FileChosen', pp.fileId, f.name, f.size, count || 1);
            },
            readRange: async function (id, start, length) {
                var pp = window.printPrice;
                if (id !== pp.fileId || !pp.file) return new Uint8Array(0);
                return new Uint8Array(await pp.file.slice(start, start + length).arrayBuffer());
            },
            // live electricity price: only the price area goes out (in the address), no cookies, nothing else
            host: function () { return location.hostname; },
            fetchPower: async function (url, ms) {
                var ctl = new AbortController(), timedOut = false;
                var timer = setTimeout(function () { timedOut = true; ctl.abort(); }, ms);
                try {
                    var r = await fetch(url, { signal: ctl.signal, credentials: 'omit', cache: 'no-store' });
                    var text = await r.text();
                    return { status: r.status, text: text, stale: r.headers.get('X-Price-Stale'), timedOut: false };
                } catch (e) {
                    return { status: 0, text: '', stale: null, timedOut: timedOut };
                } finally { clearTimeout(timer); }
            },
            pick: function () { if (window.printPrice.input) window.printPrice.input.click(); }
        };
    </script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <img src="icon-192.png" alt="" width="64" height="64" />
            <div class="loading-text">Loading… / Indlæser…</div>
            <noscript>This calculator needs JavaScript. / Lommeregneren kræver JavaScript.</noscript>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. / Noget gik galt.
        <a href="." class="reload">Reload / Genindlæs</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
