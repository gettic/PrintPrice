<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#202020" />
    <title>Gettic's 3D Print Price Calculator</title>
    <!-- base = the folder this page is in, so it works at / (local test) and at /PrintPrice/ (GitHub Pages) -->
    <base href="/" />
    <script>document.querySelector('base').href = location.pathname.replace(/[^\/]*$/, '');</script>
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/quote.css" />
    <script type="importmap"></script>
    <script>
        // small helpers for the C# side (Store.cs); this site's localStorage only, nothing leaves the browser
        window.printPrice = {
            get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
            remove: function (k) { try { localStorage.removeItem(k); } catch (e) { } },
            lang: function () { return navigator.language || ''; },
            hash: function () { return location.hash || ''; },
            page: function (lang, title) { document.documentElement.lang = lang; if (title) document.title = title; },
            // ---- files (stage 2): the chosen / dropped file stays in the browser; C# reads only the byte ranges it needs ----
            file: null, fileId: 0, dotnet: null,
            hookFiles: function (dotnet, input) {
                var pp = window.printPrice;
                pp.dotnet = dotnet;
                pp.input = input;
                input.addEventListener('change', function () { if (input.files.length) pp.useFile(input.files[0], input.files.length); input.value = ''; });
                var hasFiles = function (e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0; };
                document.addEventListener('dragover', function (e) { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; document.body.classList.add('dragging'); } });
                document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
                document.addEventListener('drop', function (e) {
                    document.body.classList.remove('dragging');
                    if (!hasFiles(e)) return;
                    e.preventDefault();
                    if (e.dataTransfer.files.length) pp.useFile(e.dataTransfer.files[0], e.dataTransfer.files.length);
                });
                pp.ready = true;
            },
            useFile: function (f, count) {
                var pp = window.printPrice;
                pp.file = f; pp.fileId++;
                return pp.dotnet.invokeMethodAsync('FileChosen', pp.fileId, f.name, f.size, count || 1);
            },
            readRange: async function (id, start, length) {
                var pp = window.printPrice;
                if (id !== pp.fileId || !pp.file) return new Uint8Array(0);
                return new Uint8Array(await pp.file.slice(start, start + length).arrayBuffer());
            },
            // live electricity price: only the price area goes out (in the address), no cookies, nothing else
            host: function () { return location.hostname; },
            fetchPower: async function (url, ms) {
                var ctl = new AbortController(), timedOut = false;
                var timer = setTimeout(function () { timedOut = true; ctl.abort(); }, ms);
                try {
                    var r = await fetch(url, { signal: ctl.signal, credentials: 'omit', cache: 'no-store' });
                    var text = await r.text();
                    return { status: r.status, text: text, stale: r.headers.get('X-Price-Stale'), timedOut: false };
                } catch (e) {
                    return { status: 0, text: '', stale: null, timedOut: timedOut };
                } finally { clearTimeout(timer); }
            },
            pick: function () { if (window.printPrice.input) window.printPrice.input.click(); },
            // ---- stage 3: price history in this browser's IndexedDB (database "PrintPrice", store "kv"); nothing leaves the browser ----
            dbp: null,
            db: function () {
                var pp = window.printPrice;
                if (!pp.dbp) {
                    pp.dbp = new Promise(function (ok, fail) {
                        if (!window.indexedDB) { fail(new Error('no IndexedDB')); return; }
                        var rq = indexedDB.open('PrintPrice', 1);
                        rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
                        rq.onsuccess = function () { ok(rq.result); };
                        rq.onerror = function () { fail(rq.error); };
                        rq.onblocked = function () { fail(new Error('blocked')); };
                    });
                    pp.dbp.catch(function () { pp.dbp = null; });
                }
                return pp.dbp;
            },
            req: function (mode, act) {
                return window.printPrice.db().then(function (db) {
                    return new Promise(function (ok, fail) {
                        var tx = db.transaction('kv', mode), rq = act(tx.objectStore('kv')), res = null;
                        rq.onsuccess = function () { res = rq.result; };
                        tx.oncomplete = function () { ok(res === undefined ? null : res); };
                        tx.onerror = tx.onabort = function () { fail(tx.error || rq.error || new Error('failed')); };
                    });
                });
            },
            // every call answers { ok, value, error } (never throws into C#)
            wrap: function (p) {
                return p.then(function (v) { return { ok: true, value: v == null ? null : String(v), error: null }; },
                              function (e) { return { ok: false, value: null, error: (e && (e.name || e.message)) || 'error' }; });
            },
            idbGet: function (k) { var pp = window.printPrice; return pp.wrap(pp.req('readonly', function (s) { return s.get(k); })); },
            idbPut: function (k, v) { var pp = window.printPrice; return pp.wrap(pp.req('readwrite', function (s) { return s.put(v, k); }).then(function () { return null; })); },
            idbDelete: function (k) { var pp = window.printPrice; return pp.wrap(pp.req('readwrite', function (s) { return s.delete(k); }).then(function () { return null; })); },
            idbKeys: function (prefix) {
                var pp = window.printPrice;
                return pp.wrap(pp.req('readonly', function (s) { return s.getAllKeys(IDBKeyRange.bound(prefix, prefix + '￿')); })
                    .then(function (keys) { return (keys || []).join('\n'); }));
            },
            persist: function () {
                try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { }); } catch (e) { }
            },
            // the model picture made small for the history, as the desktop keeps it (History.EncodePicture): longest side
            // max px (else small px when too big), PNG when it has transparent pixels, else JPEG 85; at most maxChars base64
            // characters. A PNG / JPEG that already fits (size and length) is kept as it is. null = no picture.
            smallPicture: function (url, max, small, maxChars) {
                return new Promise(function (ok) {
                    if (!url) { ok(null); return; }
                    var fits = function (u) { return u.length - u.indexOf(',') - 1 <= maxChars; };
                    var img = new Image();
                    img.onload = function () {
                        var w = img.naturalWidth, h = img.naturalHeight;
                        if ((url.indexOf('data:image/png;') === 0 || url.indexOf('data:image/jpeg;') === 0) && Math.max(w, h) <= max && fits(url)) { ok(url); return; }
                        var make = function (side) {
                            var k = Math.min(1, side / Math.max(w, h, 1));
                            var c = document.createElement('canvas');
                            c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
                            var g = c.getContext('2d');
                            g.drawImage(img, 0, 0, c.width, c.height);
                            var see = true;
                            try {
                                var d = g.getImageData(0, 0, c.width, c.height).data;
                                see = false;
                                for (var i = 3; i < d.length; i += 4) if (d[i] < 255) { see = true; break; }
                            } catch (e) { see = true; }
                            var out = see ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
                            return fits(out) ? out : null;
                        };
                        var r = null;
                        try { r = make(max) || make(small); } catch (e) { r = null; }
                        ok(r);
                    };
                    img.onerror = function () { ok(null); };
                    img.src = url;
                });
            },
            // several keys in one transaction: { ok, values (same order, null = none), error }
            idbGetMany: function (keys) {
                var pp = window.printPrice;
                return pp.db().then(function (db) {
                    return new Promise(function (ok, fail) {
                        var tx = db.transaction('kv', 'readonly'), st = tx.objectStore('kv'), out = new Array(keys.length);
                        keys.forEach(function (k, i) {
                            var rq = st.get(k);
                            rq.onsuccess = function () { out[i] = rq.result == null ? null : String(rq.result); };
                        });
                        tx.oncomplete = function () { ok(out); };
                        tx.onerror = tx.onabort = function () { fail(tx.error || new Error('failed')); };
                    });
                }).then(function (v) { return { ok: true, values: v, error: null }; },
                        function (e) { return { ok: false, values: null, error: (e && (e.name || e.message)) || 'error' }; });
            },
            idbPutMany: function (keys, values) {
                var pp = window.printPrice;
                return pp.wrap(pp.db().then(function (db) {
                    return new Promise(function (ok, fail) {
                        var tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
                        keys.forEach(function (k, i) { st.put(values[i], k); });
                        tx.oncomplete = function () { ok(null); };
                        tx.onerror = tx.onabort = function () { fail(tx.error || new Error('failed')); };
                    });
                }));
            },
            // other open tabs of this site reload the history after a change; Back/Forward and #history links switch the page
            channel: null,
            hookPage: function (dotnet) {
                var pp = window.printPrice;
                pp.page_ = dotnet;
                try {
                    pp.channel = new BroadcastChannel('PrintPrice');
                    pp.channel.onmessage = function (e) { if (e.data === 'history') dotnet.invokeMethodAsync('HistoryChangedElsewhere'); };
                } catch (e) { }
                window.addEventListener('hashchange', function () { dotnet.invokeMethodAsync('HashChanged', location.hash || ''); });
            },
            told: function () { try { if (window.printPrice.channel) window.printPrice.channel.postMessage('history'); } catch (e) { } },
            go: function (hash) { if ((location.hash || '') !== hash) location.hash = hash; },
            toTop: function () { window.scrollTo(0, 0); },
            // first-time setup: focus a box (selector) with its text selected; touch screens skipped unless always (no
            // phone keyboard popping up). The setup's text boxes also select all whenever they get focus.
            focusBox: function (selector, always) {
                if (!window.__ppSelect) {
                    window.__ppSelect = true;
                    document.addEventListener('focusin', function (e) {
                        var t = e.target;
                        if (t && t.matches && t.matches('.setup input[type=text]')) { try { t.select(); } catch (x) { } }
                    });
                }
                if (!always && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return false;
                var el = document.querySelector(selector);
                if (!el) return false;
                el.focus();
                if (el.select) { try { el.select(); } catch (x) { } }
                return true;
            },
            // ---- stage 3b: backup ----
            // a backup / safety copy as a download (made here, saved by the browser; nothing is sent)
            download: function (name, text) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
                a.download = name;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
            },
            // the backup file input (Restore > Choose file…); its file goes to C# like a dropped one
            pickBackup: function () { var i = document.getElementById('backupFile'); if (i) { i.value = ''; i.click(); } },
            hookBackupInput: function () {
                var i = document.getElementById('backupFile'), pp = window.printPrice;
                if (!i || i.hooked) return;
                i.hooked = true;
                i.addEventListener('change', function () { if (i.files.length) pp.useFile(i.files[0], 1); });
            },
            // AES-256-CBC (PKCS7, = .NET's Aes) for the online backup; .NET in the browser has no AES. Key and data stay here.
            aes: async function (key, iv, data, encrypt) {
                var k = await crypto.subtle.importKey('raw', key, { name: 'AES-CBC' }, false, [encrypt ? 'encrypt' : 'decrypt']);
                var out = encrypt ? await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, k, data)
                                  : await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, k, data);
                return new Uint8Array(out);
            },
            // one online backup call: only the storage id (in the address) and the encrypted blob go out; no cookies
            backupFetch: async function (method, url, body64, ms) {
                var ctl = new AbortController();
                var timer = setTimeout(function () { ctl.abort(); }, ms);
                try {
                    var init = { method: method, signal: ctl.signal, credentials: 'omit', cache: 'no-store' };
                    if (body64) {
                        var bin = atob(body64), b = new Uint8Array(bin.length);
                        for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
                        init.body = b; init.headers = { 'Content-Type': 'application/octet-stream' };
                    }
                    var r = await fetch(url, init);
                    var buf = new Uint8Array(await r.arrayBuffer()), s = '';
                    for (var j = 0; j < buf.length; j += 32768) s += String.fromCharCode.apply(null, buf.subarray(j, j + 32768));
                    return { status: r.status, body: btoa(s), left: r.headers.get('X-Uploads-Left'),
                             reset: r.headers.get('X-Uploads-Reset'), retryAfter: r.headers.get('Retry-After') };
                } catch (e) {
                    return { status: 0, body: '', left: null, reset: null, retryAfter: null };
                } finally { clearTimeout(timer); }
            },
            // ---- stage 4: the quote page (1000 units wide): fit to its box on screen; the print scale fits it on one A4 ----
            fitSheet: function () {
                var boxes = document.querySelectorAll('.qs-box');
                for (var i = 0; i < boxes.length; i++) {
                    var b = boxes[i], s = b.querySelector('.qs');
                    if (!s) continue;
                    b.style.setProperty('--qz', String(Math.max(0.1, b.clientWidth / 1000)));
                    var h = parseFloat(s.style.height) || 1414;
                    // 210 mm = 793.7 px; a page taller than A4 is made smaller to fit (as the desktop's PDF)
                    b.style.setProperty('--pz', String(0.7935 * Math.min(1, 1414 / h)));
                }
                var pp = window.printPrice;
                if (!pp.fitHooked) { pp.fitHooked = true; window.addEventListener('resize', pp.fitSheet); window.addEventListener('beforeprint', pp.fitSheet); }
            },
            printSheet: function (title) {
                var old = document.title;
                window.printPrice.fitSheet();
                if (title) document.title = title;   // "Save as PDF" suggests this name
                var back = function () { document.title = old; window.removeEventListener('afterprint', back); };
                window.addEventListener('afterprint', back);
                setTimeout(function () { window.print(); setTimeout(back, 1000); }, 50);
            },
            copyText: async function (text) {
                try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
                try {
                    var t = document.createElement('textarea');
                    t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
                    document.body.appendChild(t); t.select();
                    var ok = document.execCommand('copy'); t.remove(); return ok;
                } catch (e) { return false; }
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <img src="icon-192.png" alt="" width="64" height="64" />
            <div class="loading-text">Loading… / Indlæser…</div>
            <noscript>This calculator needs JavaScript. / Lommeregneren kræver JavaScript.</noscript>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. / Noget gik galt.
        <a href="." class="reload">Reload / Genindlæs</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Smaller download for visitors: GitHub Pages only serves gzip, so the big files are fetched as their published .br
        // copy and unpacked here with Google's brotli decoder (brotli-decode.min.js, MIT), then checked against the file's
        // integrity hash. Anything wrong (no .br, decoder or check fails) -> the normal file, as before.
        // Off on localhost (dotnet run, tests): the normal files.
        (function () {
            var useBr = location.hostname !== 'localhost' && !!(window.WebAssembly && window.crypto && crypto.subtle && window.Response);
            var types = { assembly: 1, dotnetwasm: 1, globalization: 1, icu: 1 };
            var decoder = useBr ? import('./brotli-decode.min.js').then(function (m) { return m.BrotliDecode; }) : null;
            if (decoder) decoder.catch(function () { });
            var hashOk = async function (bytes, integrity) {
                var m = /^sha(256|384|512)-(.+)$/.exec(integrity || '');
                if (!m) return !integrity;
                var h = new Uint8Array(await crypto.subtle.digest('SHA-' + m[1], bytes)), s = '';
                for (var i = 0; i < h.length; i++) s += String.fromCharCode(h[i]);
                return btoa(s) === m[2];
            };
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    if (!useBr || !types[type]) return undefined;
                    return (async function () {
                        try {
                            var decode = await decoder;
                            var r = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                            if (!r.ok) throw new Error('no .br');
                            var bytes = decode(new Int8Array(await r.arrayBuffer()));
                            if (!(await hashOk(bytes, integrity))) throw new Error('hash');
                            return new Response(bytes, { headers: { 'content-type': type === 'dotnetwasm' ? 'application/wasm' : 'application/octet-stream' } });
                        } catch (e) {
                            return fetch(defaultUri, integrity ? { cache: 'no-cache', integrity: integrity } : { cache: 'no-cache' });
                        }
                    })();
                }
            });
        })();
    </script>
</body>

</html>
